<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>חישוב קלוריות יומי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: "#EEF1E7", card: "#FFFFFF", ink: "#2E2A24", inkSoft: "#4A453D",
          muted: "#6B6255", mutedLight: "#8A8272", border: "#D8D2C4",
          borderLight: "#E4DFCF", row: "#F7F5EE", red: "#C1443A",
          green: "#4C6B4F", gold: "#E3A73A", blue: "#7A8FA6", track: "#EEE9DC",
        },
        fontFamily: { display: ["Rubik", "sans-serif"], body: ["Heebo", "sans-serif"] },
      },
    },
  };
</script>
<link rel="stylesheet" href="style.css" />
</head>
<body class="bg-bg font-body min-h-screen">
  <div class="w-full max-w-md mx-auto py-6 px-3" id="app">
    <div class="flex flex-col items-center justify-center py-24 gap-3">
      <div class="spin" style="width:28px;height:28px;border:3px solid #D8D2C4;border-top-color:#4C6B4F;border-radius:50%"></div>
      <p class="font-display font-bold text-sm text-ink">טוען...</p>
    </div>
  </div>

  <div id="drawer-backdrop" class="fixed inset-0 bg-ink/40 z-40 opacity-0 pointer-events-none transition-opacity"></div>
  <div id="drawer" dir="rtl" class="fixed top-0 bottom-0 left-0 w-[85%] max-w-[380px] bg-bg font-body overflow-y-auto z-50 -translate-x-full transition-transform duration-300 shadow-2xl">
    <div class="p-4" id="drawer-content"></div>
  </div>

  <script type="module" src="app.js?v=3"></script>
</body>
</html>
